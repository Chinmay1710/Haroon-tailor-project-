<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Worker Portal - Scan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg p-6 flex flex-col relative">
        <div id="loader" class="absolute inset-0 bg-white/80 flex items-center justify-center z-50">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-slate-200 border-t-blue-600"></div>
        </div>

        <div id="content" class="hidden flex-col flex-1">
            <h1 class="text-2xl font-bold text-center text-blue-700 mb-2">Tailor Shop Worker</h1>
            
            <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 my-6 shadow-sm">
                <p class="text-sm text-blue-600 font-semibold uppercase tracking-wider mb-1">Order Details</p>
                <p class="text-xl font-bold text-slate-800 mb-2" id="order-num">Loading...</p>
                <p class="text-slate-600 mb-2" id="customer-name"></p>
                <div class="border-t border-blue-100 pt-2 mt-2">
                    <p class="text-sm font-semibold text-slate-700 mb-1">Items:</p>
                    <ul id="items-list" class="text-sm text-slate-600 list-disc list-inside"></ul>
                </div>
                <div class="mt-4 pt-3 border-t border-blue-100">
                    <p class="text-sm font-semibold text-slate-700">Current Status: <span id="order-status" class="px-2 py-1 bg-white rounded-md border shadow-sm font-bold"></span></p>
                </div>
            </div>

            <div class="flex-1 flex flex-col justify-end space-y-4">
                
                <div class="bg-slate-50 border rounded-xl p-4 mb-2">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Your 4-Digit PIN</label>
                    <input type="tel" id="worker-pin" maxlength="4" class="w-full text-center text-3xl tracking-widest font-mono p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="****">
                </div>
                
                <div class="bg-slate-50 border rounded-xl p-4 mb-4">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Extra Charges (Optional)</label>
                    <div class="flex space-x-2">
                        <input type="text" id="extra-desc" placeholder="Reason (e.g., extra pockets)" class="flex-1 p-3 border border-slate-300 rounded-lg outline-none focus:border-blue-500">
                        <input type="number" id="extra-amount" placeholder="₹ Amount" class="w-28 p-3 border border-slate-300 rounded-lg outline-none focus:border-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button onclick="submitStage('CUTTING')" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 rounded-xl shadow-sm active:scale-95 transition-transform flex flex-col items-center justify-center">
                        <span class="text-xl mb-1">✂️</span>
                        <span>Cutting Done</span>
                    </button>
                    <button onclick="submitStage('STITCHING_AND_PRESSING')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-sm active:scale-95 transition-transform flex flex-col items-center justify-center">
                        <span class="text-xl mb-1">🧵</span>
                        <span>Stitch & Press</span>
                    </button>
                </div>
            </div>
        </div>
        
        <div id="success" class="hidden absolute inset-0 bg-white flex-col items-center justify-center z-40 p-6 text-center">
            <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mb-6 mx-auto">
                <span class="text-5xl">✅</span>
            </div>
            <h2 class="text-3xl font-bold text-slate-800 mb-2">Success!</h2>
            <p class="text-slate-600 text-lg mb-8" id="success-msg">Your work has been recorded.</p>
            <p class="text-slate-400 text-sm">You can now close this tab.</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id');
        
        if (!orderId) {
            alert("Invalid QR Code: No order ID found.");
        } else {
            fetchOrderDetails();
        }

        async function fetchOrderDetails() {
            try {
                const res = await fetch(`/api/orders/${orderId}`);
                if (!res.ok) throw new Error('Order not found');
                const data = await res.json();
                
                document.getElementById('order-num').textContent = data.order.order_number;
                document.getElementById('customer-name').textContent = "Customer: " + data.order.customer_name;
                document.getElementById('order-status').textContent = data.order.status;
                
                const list = document.getElementById('items-list');
                data.order.items.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = `${item.clothing_type} (Qty: ${item.quantity})`;
                    list.appendChild(li);
                });
                
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                document.getElementById('content').classList.add('flex');
            } catch (e) {
                alert("Could not load order details.");
            }
        }

        async function submitStage(stage) {
            const pin = document.getElementById('worker-pin').value;
            if (!pin || pin.length < 4) {
                alert("Please enter your 4-digit PIN");
                return;
            }
            
            const extraDesc = document.getElementById('extra-desc').value;
            const extraAmount = parseFloat(document.getElementById('extra-amount').value) || 0;
            
            document.getElementById('loader').classList.remove('hidden');
            
            try {
                const res = await fetch(`/api/orders/${orderId}/stage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pin: pin,
                        stage: stage,
                        extra_desc: extraDesc,
                        extra_amount: extraAmount
                    })
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    throw new Error(data.detail || "Failed to submit work");
                }
                
                // Show success screen
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('content').classList.add('hidden');
                document.getElementById('success').classList.remove('hidden');
                document.getElementById('success').classList.add('flex');
                
            } catch (e) {
                document.getElementById('loader').classList.add('hidden');
                alert("Error: " + e.message);
            }
        }
    </script>
</body>
</html>
