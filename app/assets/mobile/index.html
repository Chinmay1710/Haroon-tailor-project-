<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Worker Portal - Haroon Tailor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Public Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="min-h-screen flex flex-col items-center justify-center p-6 bg-white">
        <div class="w-20 h-20 bg-slate-900 rounded-2xl flex items-center justify-center mb-6 shadow-lg">
            <span class="material-symbols-outlined text-white text-4xl">content_cut</span>
        </div>
        <h1 class="text-2xl font-bold mb-2">Worker Portal</h1>
        <p class="text-slate-500 mb-8 text-center">Log in to view your tasks and track your piece-rate earnings.</p>
        
        <div class="w-full max-w-sm space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Your Name</label>
                <input type="text" id="login-name" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-slate-900 focus:ring-2 focus:ring-slate-900/20 transition-all outline-none" placeholder="e.g. Rahul">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">4-Digit PIN</label>
                <input type="tel" id="login-pin" maxlength="4" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-slate-900 focus:ring-2 focus:ring-slate-900/20 transition-all outline-none text-center font-mono text-2xl tracking-[0.5em]" placeholder="••••">
            </div>
            <button onclick="login()" id="login-btn" class="w-full bg-slate-900 text-white font-semibold py-3.5 rounded-xl hover:bg-slate-800 active:scale-[0.98] transition-all mt-4">Login</button>
        </div>
        <p id="login-error" class="text-red-500 text-sm mt-4 hidden">Invalid name or PIN.</p>
    </div>

    <!-- MAIN PORTAL SCREEN -->
    <div id="portal-screen" class="hidden">
        <header class="bg-slate-900 text-white p-6 pb-8 rounded-b-[2rem] shadow-md sticky top-0 z-20">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <p class="text-slate-400 text-sm">Welcome back,</p>
                    <h2 id="worker-name-display" class="text-xl font-bold">Worker</h2>
                </div>
                <button onclick="logout()" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">
                    <span class="material-symbols-outlined text-sm">logout</span>
                </button>
            </div>
            
            <div class="bg-white/10 rounded-xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-slate-300 text-xs font-medium uppercase tracking-wider mb-1">Pending Payout</p>
                    <div class="text-2xl font-bold" id="total-earnings">₹0</div>
                </div>
                <div class="w-12 h-12 rounded-full bg-green-500/20 text-green-400 flex items-center justify-center">
                    <span class="material-symbols-outlined">payments</span>
                </div>
            </div>
        </header>

        <main class="p-4 space-y-4 -mt-4 relative z-10" id="tasks-container">
            <!-- Tasks will be injected here -->
        </main>
    </div>

    <script>
        let currentWorker = null;

        async function login() {
            const name = document.getElementById('login-name').value;
            const pin = document.getElementById('login-pin').value;
            const btn = document.getElementById('login-btn');
            const error = document.getElementById('login-error');
            
            if (!name || pin.length !== 4) return;
            
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name, pin})
                });
                
                if (!res.ok) throw new Error();
                
                const data = await res.json();
                currentWorker = data.worker;
                
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('portal-screen').classList.remove('hidden');
                document.getElementById('worker-name-display').textContent = currentWorker.name;
                
                loadTasks();
            } catch(e) {
                error.classList.remove('hidden');
            } finally {
                btn.innerHTML = 'Login';
            }
        }
        
        function logout() {
            currentWorker = null;
            document.getElementById('login-name').value = '';
            document.getElementById('login-pin').value = '';
            document.getElementById('portal-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        async function loadTasks() {
            try {
                const res = await fetch(`/api/tasks/${currentWorker.id}`);
                const data = await res.json();
                
                const container = document.getElementById('tasks-container');
                container.innerHTML = '<h3 class="text-slate-500 font-medium px-2 mb-2">Your Assigned Tasks</h3>';
                
                let totalEarnings = 0;
                let activeTasksCount = 0;
                
                if (data.tasks.length === 0) {
                    container.innerHTML += `
                        <div class="bg-white rounded-2xl p-8 text-center shadow-sm border border-slate-100">
                            <span class="material-symbols-outlined text-slate-300 text-4xl mb-2">check_circle</span>
                            <p class="text-slate-500 font-medium">You have no assigned tasks right now.</p>
                        </div>
                    `;
                }
                
                data.tasks.forEach(t => {
                    if (t.status === 'COMPLETED' || t.status === 'PAID') {
                        if (t.status === 'COMPLETED') totalEarnings += t.payout_amount;
                    }
                    
                    if (t.status === 'ASSIGNED') {
                        activeTasksCount++;
                        container.innerHTML += `
                            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex flex-col gap-3 relative overflow-hidden">
                                <div class="absolute top-0 left-0 w-1 h-full bg-slate-900"></div>
                                <div class="flex justify-between items-start pl-2">
                                    <div>
                                        <p class="text-xs font-semibold text-slate-900 bg-slate-100 px-2 py-1 rounded inline-block mb-2">${t.order_number}</p>
                                        <h4 class="font-bold text-slate-800 text-lg">${t.clothing_type}</h4>
                                        <p class="text-sm text-slate-500">${t.customer_name}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-xs text-slate-400 font-medium uppercase">Piece Rate</p>
                                        <p class="font-bold text-slate-900">₹${t.payout_amount}</p>
                                    </div>
                                </div>
                                <button onclick="completeTask(${t.id})" class="mt-2 w-full py-3 rounded-xl bg-slate-900 text-white font-semibold flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
                                    <span class="material-symbols-outlined text-[20px]">done_all</span> Mark Completed
                                </button>
                            </div>
                        `;
                    }
                });
                
                document.getElementById('total-earnings').textContent = `₹${totalEarnings}`;
                
                if (activeTasksCount === 0 && data.tasks.length > 0) {
                    container.innerHTML += `
                        <div class="bg-white rounded-2xl p-8 text-center shadow-sm border border-slate-100">
                            <span class="material-symbols-outlined text-green-400 text-4xl mb-2">task_alt</span>
                            <p class="text-slate-800 font-bold text-lg mb-1">All Caught Up!</p>
                            <p class="text-slate-500 text-sm">You have completed all your assigned tasks.</p>
                        </div>
                    `;
                }
                
            } catch(e) {
                console.error(e);
            }
        }
        
        async function completeTask(taskId) {
            if(!confirm("Are you sure you have finished this item?")) return;
            
            try {
                await fetch(`/api/tasks/${taskId}/complete`, {method: 'POST'});
                loadTasks();
            } catch(e) {
                alert("Failed to update task");
            }
        }
    </script>
</body>
</html>
